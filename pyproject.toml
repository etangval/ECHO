[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalcreativity-sonification"
version = "0.2.0"
description = "Event-preserving point-process sonification with higher-order harmonic optimisation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yuji Ikegaya"}]
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<4", "mido>=1.3,<2"]

[project.optional-dependencies]
audio = ["imageio-ffmpeg>=0.5,<1"]
fits = ["astropy>=6,<8"]
research = ["scipy>=1.11,<2", "pyarrow>=14", "openpyxl>=3.1,<4", "h5py>=3.10,<4", "matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
digitalcreativity = "digitalcreativity.cli:main"

[project.urls]
Repository = "https://github.com/etangval/ECHO"
Documentation = "https://github.com/etangval/ECHO/tree/main/docs"

[tool.setuptools.package-data]
digitalcreativity = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
